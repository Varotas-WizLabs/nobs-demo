<!doctype html>
<html lang="ru">
  <head>
    <script src="src/demoShim.js?v=04a8d84c10"></script>

    <script src="src/uiLangEarly.js"></script>
    <!-- Theme before first paint (settings: dark / light / system). -->
    <script>
      try {
        var nobsTheme = (JSON.parse(localStorage.getItem("nobs.settings") || "{}").theme) || "dark";
        if (nobsTheme === "system") nobsTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = nobsTheme === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skepticum — индекс источников</title>
    <link rel="stylesheet" href="styles.css?v=04a8d84c10" />
    <link rel="stylesheet" href="sources.css" />
  </head>
  <body class="nobs-cm-page nobs-src-page">
    <header class="nobs-cm-header">
      <div class="nobs-src-topline"><a class="nobs-cm-back" href="index.html">← NOBS</a></div>
      <h1 data-i18n="srcui.title">Индекс источников</h1>
      <p class="nobs-src-header-links"><a class="nobs-settings-link" href="trust.html" data-i18n="srcui.trustLink">Сигналы доверия: все коннекторы →</a></p>
      <p class="nobs-cm-lead" data-i18n="srcui.lead">
        Все сайты, на которые опирались проверки: сколько раз использованы, в какой роли, как часто сказанное ими подтвердилось,
        и оценка надёжности 0–100. Нажмите на источник, чтобы увидеть оценки по темам, использования и что меняло оценку.
      </p>
    </header>
    <main id="sources"></main>
    <script type="module">
      import { applyTheme } from "./src/settings.js?v=04a8d84c10";
      import { t } from "./src/i18n.js?v=04a8d84c10";
      import { initUiLang, reloadWithout, renderLangSwitch, translatePage } from "./src/uiLang.js?v=04a8d84c10";
      import "./src/stringsSources.js?v=04a8d84c10";
      import { mountSourcesPage } from "./src/sourcesPage.js?v=04a8d84c10";
      applyTheme(document);
      const lang = initUiLang();
      translatePage(document, lang);
      document.title = t("srcui.docTitle", lang);
      renderLangSwitch(document, document.querySelector(".nobs-src-topline"), { lang, storage: localStorage, reload: () => reloadWithout() });
      mountSourcesPage(document.getElementById("sources"), { fetchImpl: fetch });
    </script>
  </body>
</html>

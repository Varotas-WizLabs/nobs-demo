<!doctype html>
<html lang="ru">
  <head>
    <script src="src/demoShim.js?v=4d95c3d228"></script>

    <script src="src/uiLangEarly.js"></script>
    <!-- Theme before first paint (settings: dark / light / system). -->
    <script>
      try {
        var nobsTheme = (JSON.parse(localStorage.getItem("nobs.settings") || "{}").theme) || "dark";
        if (nobsTheme === "system") nobsTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = nobsTheme === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="cmui.pageTitle">Skeptium — комментаторы</title>
    <link rel="stylesheet" href="styles.css?v=4d95c3d228" />
  </head>
  <body class="nobs-cm-page">
    <header class="nobs-cm-header">
      <a class="nobs-cm-back" href="index.html">← NOBS</a>
      <h1 data-i18n="cmui.heading">Комментаторы</h1>
      <p class="nobs-cm-lead" data-i18n="cmui.lead">
        Кто комментирует флажки в плеере. «Душнила» спокойно пересказывает итог проверки, «Яблогер» — открыто помеченная пародия на хайп-блогера.
        Выбрать комментатора в плеере: двойной клик (или долгое нажатие) по кнопке голоса рядом с громкостью.
      </p>
    </header>
    <main id="commentators"></main>
    <script type="module">
      import { applyTheme } from "./src/settings.js?v=4d95c3d228";
      import { initUiLang, renderLangSwitch, reloadWithout, translatePage } from "./src/uiLang.js?v=4d95c3d228";
      import { t } from "./src/i18n.js?v=4d95c3d228";
      import "./src/stringsCommentators.js?v=4d95c3d228";
      import { mountCommentatorsPage } from "./src/commentatorsPage.js?v=4d95c3d228";
      applyTheme(document);
      const lang = initUiLang();
      translatePage(document, lang);
      document.title = t("cmui.pageTitle", lang);
      let store = null;
      try {
        store = localStorage;
      } catch {
        store = null;
      }
      renderLangSwitch(document, document.querySelector(".nobs-cm-header"), { lang, storage: store, reload: () => reloadWithout() });
      mountCommentatorsPage(document.getElementById("commentators"), { fetchImpl: fetch });
    </script>
  </body>
</html>

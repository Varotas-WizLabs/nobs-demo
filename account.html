<!doctype html>
<html lang="ru">
  <head>
    <!-- Theme before first paint (settings: dark / light / system). -->
    <script>
      try {
        var nobsTheme = (JSON.parse(localStorage.getItem("nobs.settings") || "{}").theme) || "dark";
        if (nobsTheme === "system") nobsTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = nobsTheme === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Contrarium — аккаунт</title>
    <link rel="stylesheet" href="styles.css?v=4250a1ebb1" />
    <script src="vendor/supabase.js"></script>
  </head>
  <body>
    <header class="nobs-topbar">
      <a class="nobs-logo" href="index.html" aria-label="Contrarium">
        <span class="nobs-logo-word">Contrarium</span>
      </a>
    </header>
    <main class="nobs-home nobs-request nobs-account">
      <h1 data-i18n="account.title">Аккаунт</h1>
      <div id="account-root" aria-live="polite"></div>
    </main>

    <script type="module">
      import { t } from "./src/i18n.js?v=4250a1ebb1";
      import { initUiLang } from "./src/uiLang.js?v=4250a1ebb1";
      import { mountAccountPage } from "./src/accountPage.js?v=4250a1ebb1";

      const lang = initUiLang();
      document.title = t("account.pageTitle", lang);
      for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n, lang);
      mountAccountPage({ root: document.getElementById("account-root"), lang });
    </script>
  <script type="module" src="src/accountMenuBoot.js"></script>
  </body>
</html>

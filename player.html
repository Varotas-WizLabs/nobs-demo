<!doctype html>
<html lang="en">
  <head>
    <script src="src/demoShim.js?v=4dd68439c6"></script>

    <!-- Theme before first paint (settings: dark / light / system). -->
    <script>
      try {
        var nobsTheme = (JSON.parse(localStorage.getItem("nobs.settings") || "{}").theme) || "dark";
        if (nobsTheme === "system") nobsTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = nobsTheme === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOBS — демо</title>
    <link rel="stylesheet" href="styles.css?v=4dd68439c6" />
  </head>
  <body>
    <p class="nobs-demo-banner" role="note">Демо NOBS — статическая витрина. Разборы сделаны автоматически (языковые модели и веб-поиск) и могут содержать ошибки; проверяйте источники. Здесь ничего не принимается и не отправляется.</p>

    <div class="nobs-layout">
    <!-- Library (src/library.js): every completed analysis; click to switch. -->
    <aside id="library" class="nobs-library" aria-label="Analyses"></aside>
    <main>
      <div id="player-container">
        <div id="player"></div>

        <!-- Flag/chain icon overlay, driven by bootstrapPlayerPage (src/main.js) via
             overlay-container's data-mode/data-flag attributes and chain-icon's
             display style. Lives inside #player-container (the element put into
             fullscreen by the control bar) and is absolutely positioned within it
             in styles.css, so it sits over the video and stays visible and
             clickable in fullscreen too. -->
        <div id="overlay-container" class="nobs-overlay" data-mode="processing" data-flag="">
          <span id="processing-indicator" class="nobs-processing">Processing…</span>
          <span id="failed-indicator" class="nobs-failed">Analysis failed.</span>
          <button id="chain-icon" type="button" class="nobs-icon nobs-chain-icon" aria-label="Related claims" style="display: none;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></button>
          <button id="flag-icon" type="button" class="nobs-icon nobs-flag-icon" aria-label="Claim fact-check"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 3h2v18H6zm3 1h9l-2 4 2 4H9z"/></svg></button>
        </div>

        <div id="popup-container" class="nobs-popup-container"></div>
      </div>

      <!-- Processing log (src/processingLog.js): outside #player-container so
           it never depends on, or is replaced by, the YouTube player. -->
      <section id="processing-log" aria-label="Processing log"></section>
    </main>
    <!-- Claim list (src/claimList.js) in a collapsible right-hand panel:
         outside #player-container, so it is hidden in fullscreen; click a row
         to jump there and play. A second tab, «Скупы» (src/scoopList.js),
         appears when the run has a scoop generation. -->
    <aside id="claims-panel" class="nobs-claims-panel" aria-label="Claims">
      <div class="nobs-claims-panel-bar">
        <div class="nobs-panel-tabs" role="tablist" hidden>
          <button type="button" class="nobs-panel-tab" role="tab" id="tab-claims" data-tab="claims" aria-controls="claim-list" aria-selected="true"></button>
          <button type="button" class="nobs-panel-tab" role="tab" id="tab-scoops" data-tab="scoops" aria-controls="scoop-list" aria-selected="false" tabindex="-1"></button>
        </div>
      </div>
      <div id="claims-panel-content">
        <div id="claim-list" role="tabpanel" aria-labelledby="tab-claims"></div>
        <div id="scoop-list" role="tabpanel" aria-labelledby="tab-scoops" hidden></div>
      </div>
    </aside>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
      import { buildControlBar, resolveVideoId, whenYouTubeApiReady } from "./src/controlBar.js?v=4dd68439c6";
      import { bootstrapPlayerPage } from "./src/main.js?v=4dd68439c6";
      import { startProcessingLog } from "./src/processingLog.js?v=4dd68439c6";
      import { startLibrary } from "./src/library.js?v=4dd68439c6";
      import { buildShareControl, isSolo } from "./src/share.js?v=4dd68439c6";
      import { renderClaimList } from "./src/claimList.js?v=4dd68439c6";
      import { buildRailFilters } from "./src/railFilters.js?v=4dd68439c6";
      import { renderScoopList, seekToAnchor } from "./src/scoopList.js?v=4dd68439c6";
      import { filterTimelineItems, timelineItems } from "./src/tags.js?v=4dd68439c6";
      import { downloadIcon, listIcon, makePanelToggle, setCollapsed } from "./src/sidePanel.js?v=4dd68439c6";
      import { downloadMarkdown, downloadTranscript, printReport } from "./src/report.js?v=4dd68439c6";
      import { t } from "./src/i18n.js?v=4dd68439c6";
      import { checkVoiceHealth, createNarrator, loadEnabled, normalizeLang, saveEnabled } from "./src/voice.js?v=4dd68439c6";
      import { createEngine, createSystemEngine, fetchVoiceEngines, findSystemVoice, piperSupported, resolveEngineId, systemSupported } from "./src/voiceEngines.js?v=4dd68439c6";
      import { createHoldIcon } from "./src/holdIcon.js?v=4dd68439c6";
      import { applyTheme, followPlayback, localVoiceIds, mountPanelSettings, onSettingsChange, seekTarget, setLocalVoices, setSileroAvailable, showTagFilter, showTimelineFlags, voiceEngine, voiceRewindSec, voiceStyle, youtubeCaptions } from "./src/settings.js?v=4dd68439c6";
      applyTheme(document);

      {
        const panel = document.getElementById("claims-panel");
        const toggle = makePanelToggle(panel, {
          contentId: "claims-panel-content",
          makeIcon: listIcon,
          showLabel: "Show claims",
          hideLabel: "Hide claims",
        });
        panel.querySelector(".nobs-claims-panel-bar").appendChild(toggle);
        setCollapsed(panel, true);
      }

      // Download the full write-up of the loaded run: PDF (print dialog,
      // "Save as PDF") or Markdown. Shown once the run is complete.
      let exportRun = null;
      function videoTitle() {
        try {
          return currentPlayer?.getVideoData?.().title ?? "";
        } catch {
          return "";
        }
      }
      function setupExport(run) {
        exportRun = run;
        const bar = document.querySelector(".nobs-claims-panel-bar");
        let wrap = bar.querySelector(".nobs-export");
        const lang = run.caption_language ?? "en";
        if (!wrap) {
          wrap = document.createElement("div");
          wrap.className = "nobs-export";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "nobs-side-toggle nobs-export-button";
          button.setAttribute("aria-haspopup", "menu");
          button.setAttribute("aria-expanded", "false");
          button.appendChild(downloadIcon(document));
          const menu = document.createElement("div");
          menu.className = "nobs-export-menu";
          menu.setAttribute("role", "menu");
          menu.hidden = true;
          const item = (kind, action) => {
            const entry = document.createElement("button");
            entry.type = "button";
            entry.setAttribute("role", "menuitem");
            entry.dataset.export = kind;
            entry.addEventListener("click", () => {
              closeMenu();
              // The scoops section of the write-up comes from the loaded tab.
              if (exportRun) action(scoopsResponse ? { ...exportRun, scoops: scoopsResponse } : exportRun, { title: videoTitle() });
            });
            return entry;
          };
          menu.append(
            item("pdf", printReport),
            item("md", downloadMarkdown),
            item("txt", (run, opts) => downloadTranscript(run, opts).catch((err) => console.error("transcript download failed", err)))
          );
          const closeMenu = () => {
            menu.hidden = true;
            button.setAttribute("aria-expanded", "false");
          };
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            menu.hidden = !menu.hidden;
            button.setAttribute("aria-expanded", String(!menu.hidden));
          });
          document.addEventListener("click", (event) => {
            if (!wrap.contains(event.target)) closeMenu();
          });
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeMenu();
          });
          wrap.append(button, menu);
          bar.insertBefore(wrap, bar.firstChild);
        }
        // Share: the public single-video link, next to download.
        bar.querySelector(".nobs-share")?.remove();
        wrap.after(
          buildShareControl(document, {
            getRunId: () => exportRun.run_id,
            lang,
            demo: document.documentElement.dataset.demo === "1",
          })
        );
        // Shared link: the settings gear stays next to share / download.
        if (isSolo(window.location.search)) mountPanelSettings(bar, document);
        const button = wrap.querySelector(".nobs-export-button");
        button.title = t("export.button", lang);
        button.setAttribute("aria-label", button.title);
        wrap.querySelector('[data-export="pdf"]').textContent = t("export.pdf", lang);
        wrap.querySelector('[data-export="md"]').textContent = t("export.md", lang);
        wrap.querySelector('[data-export="txt"]').textContent = t("export.txt", lang);
      }

      const params = new URLSearchParams(window.location.search);
      const runId = params.get("run_id");

      // `?solo=1` (a shared link): only this video, no library of others.
      if (isSolo(window.location.search)) {
        document.documentElement.dataset.solo = "1";
        document.getElementById("library").hidden = true;
        // The gear lives in the hidden analyses panel: put one into the right
        // panel's bar, so a viewer of a shared link can change the voice too.
        mountPanelSettings(document.querySelector(".nobs-claims-panel-bar"), document);
      } else {
        startLibrary({ root: document.getElementById("library"), fetchImpl: fetch, currentRunId: runId });
      }

      // Started at once, independently of the YouTube player: the log and
      // status show even while the video loads (or if it fails to).
      if (runId) {
        startProcessingLog({
          runId,
          fetchImpl: fetch,
          pollIntervalMs: 1500,
          root: document.getElementById("processing-log"),
        });
      }

      // ---- Right panel tabs: claims / scoops ----
      const TAB_KEY = "nobs.panelTab";
      const tabs = document.querySelector(".nobs-panel-tabs");
      const panes = { claims: document.getElementById("claim-list"), scoops: document.getElementById("scoop-list") };
      let scoopsResponse = null;
      let scoopsKey = null;
      let scoopView = null;
      let scoopPoll = null;
      function savedTab() {
        try {
          return localStorage.getItem(TAB_KEY) === "scoops" ? "scoops" : "claims";
        } catch {
          return "claims";
        }
      }
      function selectTab(name) {
        if (tabs.hidden) name = "claims";
        for (const button of tabs.querySelectorAll("[role=tab]")) {
          const on = button.dataset.tab === name;
          button.setAttribute("aria-selected", String(on));
          button.tabIndex = on ? 0 : -1;
        }
        for (const [key, pane] of Object.entries(panes)) pane.hidden = key !== name;
      }
      for (const button of tabs.querySelectorAll("[role=tab]")) {
        button.addEventListener("click", () => {
          selectTab(button.dataset.tab);
          try {
            localStorage.setItem(TAB_KEY, button.dataset.tab);
          } catch {
            // Storage blocked: the choice lasts for this page only.
          }
        });
        button.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          const other = tabs.querySelector(`[role=tab]:not([data-tab="${button.dataset.tab}"])`);
          other.click();
          other.focus();
        });
      }
      function labelTabs(lang, count) {
        tabs.querySelector('[data-tab="claims"]').textContent = t("scoop.tabClaims", lang);
        const scoopTab = tabs.querySelector('[data-tab="scoops"]');
        scoopTab.textContent = t("scoop.tab", lang);
        if (count) {
          const badge = document.createElement("span");
          badge.className = "nobs-panel-tab-count";
          badge.textContent = String(count);
          scoopTab.appendChild(badge);
        }
      }
      function seekTo(sec) {
        seekToAnchor(currentPlayer, sec);
      }
      function drawScoops(run, status) {
        const lang = run.caption_language ?? "en";
        const demo = document.documentElement.dataset.demo === "1";
        scoopView = renderScoopList(panes.scoops, run, scoopsResponse, {
          lang,
          status,
          onSeek: seekTo,
          onSelectClaim: (claim) => seekTo(claim.start_sec),
          onRegenerate: demo ? undefined : () => regenerateScoops(run),
        });
        labelTabs(lang, scoopsResponse?.scoop_run?.status === "complete" ? (scoopsResponse.scoops ?? []).length : 0);
      }
      async function loadScoops(run) {
        const response = await fetch(`/runs/${run.run_id}/scoops`);
        if (!response.ok) throw new Error(`scoops: HTTP ${response.status}`);
        scoopsResponse = await response.json();
        drawScoops(run);
        if (scoopsResponse.active) pollScoops(run, scoopsResponse.active.id);
      }
      function pollScoops(run, scoopRunId) {
        clearTimeout(scoopPoll);
        scoopPoll = setTimeout(async () => {
          try {
            const status = await (await fetch(`/scoop-runs/${scoopRunId}/status`)).json();
            if (status.status === "pending" || status.status === "running") {
              drawScoops(run, status);
              pollScoops(run, scoopRunId);
            } else {
              await loadScoops(run);
            }
          } catch (err) {
            console.error("scoop status failed", err);
            pollScoops(run, scoopRunId);
          }
        }, 3000);
      }
      async function regenerateScoops(run) {
        try {
          const response = await fetch(`/runs/${run.run_id}/scoops`, { method: "POST" });
          if (!response.ok && response.status !== 409) throw new Error(`scoops: HTTP ${response.status}`);
          await loadScoops(run);
        } catch (err) {
          console.error("scoop generation failed to start", err);
        }
      }
      // The tab exists only when the run has a scoop generation (finished,
      // running or failed); otherwise the panel shows the claims alone.
      function setupScoops(run) {
        const summary = run.scoops ?? null;
        tabs.hidden = !summary;
        if (!summary) {
          scoopsResponse = null;
          scoopView = null;
          selectTab("claims");
          return;
        }
        labelTabs(run.caption_language ?? "en", summary.shown ?? 0);
        selectTab(savedTab());
        const key = `${run.run_id}:${summary.scoop_run_id}:${summary.active_id}`;
        if (key === scoopsKey) {
          if (scoopsResponse) drawScoops(run);
          return;
        }
        scoopsKey = key;
        loadScoops(run).catch((err) => console.error("scoops failed to load", err));
      }

      // ---- Flag narrator (src/voice.js): reads each shown flag aloud ----
      // Its button (next to the volume control) shows for a run in a language
      // that has a voice (Russian, Hebrew) whenever some engine can speak here
      // (src/voiceEngines.js). Russian: Piper in the browser (WebAssembly), the
      // browser's own voice, or the local Silero sidecar (/voice/health ok).
      // Hebrew: the browser's he-IL voice, or a local engine GET /voice/engines
      // lists (Carmit, Pocket voices); with neither the button shows disabled
      // with a tooltip. The choice is per language (settings voiceEngine.<lang>).
      let narrator = null;
      let voiceLang = null;
      let sileroHealthy = false;
      const piperOk = piperSupported();
      const systemOk = systemSupported();
      // One browser-voice engine per language (it picks a voice in that language).
      const systemEngines = {};
      const systemEngineFor = (lang) => (systemOk ? (systemEngines[lang] ??= createSystemEngine({ lang })) : null);
      const isSystemEngine = (e) => Boolean(e) && Object.values(systemEngines).includes(e);
      let engineId = null;
      let engine = null;
      let holdIcon = null;
      // The viewer's choice (localStorage "nobs.voice"); kept here too, so a
      // blocked storage still remembers it for this page.
      let voiceWanted = loadEnabled();
      const voiceBase = () => normalizeLang(voiceLang);
      function engineFlags() {
        // Hebrew: the system voice only when the browser has a Hebrew voice
        // (another voice would mangle it); Piper has no Hebrew voice.
        if (voiceBase() === "he") return { system: systemOk && Boolean(findSystemVoice("he")), local: localVoiceIds("he") };
        return { silero: sileroHealthy, piper: piperOk, system: systemOk };
      }
      function wantedEngineId() {
        return resolveEngineId(voiceEngine(voiceBase()), engineFlags(), voiceBase());
      }
      function voiceAvailable() {
        return Boolean(narrator?.supports(voiceLang)) && wantedEngineId() !== null;
      }
      function renderVoice() {
        if (!controls || !narrator) return;
        const lang = voiceLang ?? "en";
        // A Hebrew run with no voice in this browser: the button shows,
        // disabled, and says why.
        if (narrator.supports(voiceLang) && !voiceAvailable() && voiceBase() === "he") {
          const why = t("voice.noHebrew", lang);
          controls.setVoiceState({ available: false, disabled: true, on: false, title: why, label: why });
          return;
        }
        const on = voiceAvailable() && narrator.isEnabled();
        let title = t(on ? "voice.on" : "voice.off", lang);
        // A Piper model still downloading: show how far.
        if (on && engine?.getState?.() === "loading") {
          title = t("voice.loading", lang).replace("{pct}", String(Math.round((engine.getProgress?.() ?? 0) * 100)));
        }
        controls.setVoiceState({ available: voiceAvailable(), on, title, label: title });
      }
      // Pick the engine from the setting and what this page can do; a new
      // engine replaces the old one at once (prepared audio is dropped).
      function applyEngine() {
        if (!narrator) return;
        const base = voiceBase();
        const id = wantedEngineId();
        if (!id) return;
        const key = `${base}|${id}`;
        if (key !== engineId) {
          if (engine && !isSystemEngine(engine)) engine.destroy?.();
          engineId = key;
          engine =
            id === "system"
              ? systemEngineFor(base)
              : createEngine(id, {
                  fetchImpl: fetch,
                  lang: base,
                  onProgress: () => renderVoice(),
                  onState: (state) => {
                    if (state === "ready") narrator.engineReady();
                    if (state === "failed") console.warn("[voice] Piper failed to load; using the browser voice");
                    renderVoice();
                  },
                });
          // The browser voice stands in while a model loads or a local
          // engine fails -- only when it has a voice in the run's language.
          narrator.setEngine(engine, id === "system" || !engineFlags().system ? null : systemEngineFor(base));
        }
        // The voice is on: start loading the model now (the system voice
        // speaks meanwhile).
        if (narrator.isEnabled()) engine.prepare?.().catch?.(() => {});
      }
      function applyVoice() {
        if (!narrator) return;
        // The engine first, so the new language never speaks with the old one.
        applyEngine();
        narrator.setLanguage(voiceLang);
        narrator.setEnabled(voiceAvailable() && voiceWanted);
        applyEngine();
        renderVoice();
      }
      function toggleVoice() {
        if (!narrator || !voiceAvailable()) return;
        const on = !narrator.isEnabled();
        voiceWanted = on;
        saveEnabled(on);
        // This click is a user gesture: unlock the speech audio for later.
        if (on) narrator.unlock();
        narrator.setEnabled(on);
        applyEngine();
        renderVoice();
      }
      function setupVoice(player) {
        // The big flag-coloured "pause" sign while the narrator holds the video.
        holdIcon = createHoldIcon(document.getElementById("player-container"));
        // Style from the settings ("casual" by default); red flags open with
        // the error sound.
        narrator = createNarrator({
          player,
          fetchImpl: fetch,
          style: voiceStyle(),
          errorCue: true,
          rewindSec: voiceRewindSec,
          onHold: (claim) => holdIcon.hold(claim),
          onItem: (claim) => holdIcon.item(claim),
          onRelease: (how) => holdIcon.release(how),
        });
        onSettingsChange((_settings, name) => {
          if (name === "voiceStyle") narrator.setStyle(voiceStyle());
          // "voiceEngine.ru" / "voiceEngine.he": the current run's language
          // decides which one applies.
          if (String(name).startsWith("voiceEngine")) {
            applyEngine();
            renderVoice();
          }
        });
        // The viewer taking over the playback cancels a narration in progress
        // (and its auto-resume): play/pause, the flag and chain icons (their
        // popups), a drag on the seek bar. Capture phase: before the popup
        // code pauses the video.
        const interrupt = () => narrator.interrupt();
        controls.playPause.addEventListener("click", interrupt, true);
        // Speech plays from a timer, outside any gesture; browsers allow that
        // only for an element first played in a gesture on this page. Unlock
        // it on the play button and on any click or key here (a no-op once
        // unlocked). Clicks inside the YouTube iframe do not count.
        const unlock = () => {
          if (narrator.isEnabled()) narrator.unlock();
        };
        controls.playPause.addEventListener("click", unlock, true);
        document.addEventListener("pointerdown", unlock, true);
        document.addEventListener("keydown", unlock, true);
        controls.seekBar.addEventListener("input", interrupt, true);
        document.getElementById("flag-icon")?.addEventListener("click", interrupt, true);
        document.getElementById("chain-icon")?.addEventListener("click", interrupt, true);
        applyVoice();
        checkVoiceHealth(fetch).then((ok) => {
          sileroHealthy = ok;
          setSileroAvailable(ok);
          applyVoice();
        });
        // Local engines (Carmit, Pocket voices); {} when the sidecar is down
        // and on the public page.
        fetchVoiceEngines(fetch).then((body) => {
          setLocalVoices(body);
          applyVoice();
        });
        // Browsers fill their voice list late: a Hebrew voice may appear now.
        try {
          window.speechSynthesis?.addEventListener?.("voiceschanged", () => applyVoice());
        } catch {
          // no Web Speech
        }
      }

      let list = null;
      let highlightTimer = null;
      let shownRun = null;
      // "Show possible tags" switched in the settings dialog: redraw the
      // list, its filters and the timeline at once (the popup and the
      // export read the setting when they open).
      onSettingsChange((_settings, name) => {
        if ((name === "showPossibleTags" || name === "showTagFilter") && shownRun) showRun(shownRun);
        if (name === "showTimelineFlags" && shownRun) drawMarkers(filteredClaims ?? shownRun.claims ?? []);
      });
      // The verdict filter (several at once), shared by the list chips and
      // the circles on the collapsed panel; kept across redraws.
      let selectedFlags = [];
      let filteredClaims = null;
      let rail = null;
      // Flag markers on the timeline, unless the setting hides them.
      function drawMarkers(claims) {
        if (controls) controls.setMarkers(showTimelineFlags() ? claims : []);
      }
      // Claim list, flag markers, and the tag marks / ad segments on the
      // timeline (rebuilt when the tags arrive after the run).
      function showRun(run) {
        if (run.status !== "complete" || !currentPlayer) return;
        shownRun = run;
        filteredClaims = null;
        if (controls) {
          drawMarkers(run.claims ?? []);
          controls.setTimelineItems(timelineItems(run));
        }
        // The narrator reads the same flags the timeline shows.
        if (narrator) {
          narrator.setClaims(run.claims ?? []);
          narrator.setRun(run.run_id);
          voiceLang = run.caption_language ?? "en";
          applyVoice();
        }
        setupExport(run);
        document.body.dataset.lang = run.caption_language ?? "en";
        const allItems = timelineItems(run);
        list = renderClaimList(document.getElementById("claim-list"), run, {
          followPlayback,
          showTagFilter,
          initialFlags: selectedFlags,
          // The list's flag and tag filters apply to the timeline too.
          onFilterChange: ({ claims, flag, flags, tag }) => {
            selectedFlags = flags ?? [];
            filteredClaims = claims;
            rail?.update(selectedFlags);
            narrator?.setClaims(claims);
            if (!controls) return;
            drawMarkers(claims);
            controls.setTimelineItems(filterTimelineItems(allItems, { flag, tag }));
          },
          onSelect: (claim) => {
            currentPlayer.seekTo(seekTarget(claim.start_sec), true);
            currentPlayer.playVideo();
          },
        });
        // Flag circles on the collapsed panel (CSS shows them only there).
        document.querySelector("#claims-panel .nobs-rail-filters")?.remove();
        rail = buildRailFilters(document, {
          counts: list.flagCounts(),
          selected: selectedFlags,
          lang: run.caption_language ?? "en",
          onChange: (flags) => list.setFlags(flags),
        });
        document.querySelector("#claims-panel .nobs-claims-panel-bar").after(rail.root);
        setupScoops(run);
        if (highlightTimer === null) {
          highlightTimer = setInterval(() => {
            const now = currentPlayer.getCurrentTime();
            if (list && !panes.claims.hidden) list.highlight(now);
            if (scoopView && !panes.scoops.hidden) scoopView.highlight(now);
          }, 500);
        }
      }
      let currentPlayer = null;

      let apiReady = false;
      let videoId = null;
      let initStarted = false;
      let controls = null;

      // YouTube's own captions: off unless the setting turns them on.
      function applyCaptionsNow(player) {
        try {
          if (youtubeCaptions()) {
            player.loadModule?.("captions");
          } else {
            player.setOption?.("captions", "track", {});
            player.unloadModule?.("captions");
          }
        } catch {
          // Older players without the module API: nothing to do.
        }
      }
      // YouTube loads its captions module a moment after playback starts
      // (and again after seeks), so apply now and once more shortly after.
      function applyCaptions(player) {
        applyCaptionsNow(player);
        setTimeout(() => applyCaptionsNow(player), 800);
        setTimeout(() => applyCaptionsNow(player), 2500);
      }
      onSettingsChange((_settings, name) => {
        if (name === "youtubeCaptions" && currentPlayer) applyCaptions(currentPlayer);
      });

      function initPlayerIfReady() {
        if (!apiReady || !videoId || initStarted) {
          return;
        }
        initStarted = true;
        new YT.Player("player", {
          videoId,
          // cc_load_policy 0: YouTube captions are not forced on; the
          // "youtubeCaptions" setting turns them on (applyCaptions).
          playerVars: { controls: 0, cc_load_policy: 0 },
          events: {
            // Keeps the play/pause glyph in step with the real player, whatever
            // changed its state (video-surface click, popup, end, buffering).
            onStateChange: (event) => {
              if (controls) controls.setPlayerState(event.data);
              narrator?.onPlayerState(event.data);
              // YouTube loads its captions module when playback starts.
              if (event.data === 1) applyCaptions(event.target);
            },
            onReady: (event) => {
              const player = event.target;
              currentPlayer = player;
              applyCaptions(player);
              controls = buildControlBar(player, document.getElementById("player-container"), {
                onVoiceToggle: () => toggleVoice(),
              });
              setupVoice(player);

              if (runId) {
                bootstrapPlayerPage({
                  player,
                  fetchImpl: fetch,
                  runId,
                  pollIntervalMs: 2000,
                  domRefs: {
                    flagIcon: document.getElementById("flag-icon"),
                    chainIcon: document.getElementById("chain-icon"),
                    popupContainer: document.getElementById("popup-container"),
                    overlayContainer: document.getElementById("overlay-container"),
                    failedIndicator: document.getElementById("failed-indicator"),
                  },
                  onRunLoaded: (run) => showRun(run),
                  // The presentation tags finished after the run was shown.
                  onRunUpdated: (run) => showRun(run),
                });
              }
            },
          },
        });
      }

      // Also covers the API having loaded before this deferred module ran.
      whenYouTubeApiReady(window, () => {
        apiReady = true;
        initPlayerIfReady();
      });

      resolveVideoId(params, fetch)
        .then((resolved) => {
          videoId = resolved;
          initPlayerIfReady();
        })
        .catch((err) => {
          console.error(err);
          const container = document.getElementById("player-container");
          container.textContent = "Could not load this video: " + err.message;
        });
    </script>
  </body>
</html>

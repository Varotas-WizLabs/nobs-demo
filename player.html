  <body>
    <!-- Brand bar: the «Skeptium» logo, top left. -->

        <svg class="nobs-logo-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><linearGradient id="nobs-logo-spectrum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0"><stop offset="0%" stop-color="#EF3442"/><stop offset="22%" stop-color="#F87B31"/><stop offset="46%" stop-color="#F8D46B"/><stop offset="68%" stop-color="#CDE8C5"/><stop offset="100%" stop-color="#83DDE4"/></linearGradient></defs><rect class="nobs-logo-frame" x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="url(#nobs-logo-spectrum)" stroke-width="7"/><path class="nobs-logo-ink" fill="url(#nobs-logo-spectrum)" d="M29.69 66.37Q25.72 66.37 22.75 65.19Q19.79 64.01 18.15 61.55Q16.51 59.09 16.49 55.25H24.36Q24.44 56.65 25.07 57.61Q25.7 58.58 26.83 59.07Q27.97 59.56 29.57 59.56Q30.9 59.56 31.81 59.23Q32.71 58.9 33.17 58.32Q33.63 57.74 33.63 56.98Q33.63 56.28 33.19 55.76Q32.75 55.23 31.75 54.8Q30.74 54.37 29.04 54.02L25.96 53.37Q21.92 52.51 19.59 50.42Q17.27 48.34 17.27 44.75Q17.27 41.84 18.85 39.66Q20.43 37.47 23.2 36.25Q25.98 35.03 29.61 35.03Q33.32 35.03 36.02 36.27Q38.72 37.51 40.18 39.76Q41.65 42.01 41.67 45H33.71Q33.61 43.5 32.62 42.67Q31.62 41.84 29.61 41.84Q28.34 41.84 27.52 42.14Q26.7 42.44 26.31 42.97Q25.92 43.5 25.92 44.18Q25.92 44.9 26.34 45.44Q26.76 45.98 27.67 46.38Q28.59 46.78 30.02 47.09L32.52 47.62Q35.05 48.16 36.86 49.04Q38.68 49.92 39.84 51.1Q40.99 52.28 41.54 53.76Q42.08 55.23 42.08 56.98Q42.08 59.99 40.59 62.09Q39.11 64.2 36.34 65.28Q33.57 66.37 29.69 66.37ZM51.91 60.59V50.78H53.05L58.59 43.07H67.86L58.55 55.09H56.21ZM44.52 66V35.44H52.77V66ZM58.67 66 53.42 56.94 58.8 51.07 68.07 66ZM78.64 34.17L78.64 50.13L74.81 50.13L74.81 34.17ZM84.59 39.82L70.77 47.80L68.85 44.48L82.67 36.50ZM70.77 36.50L84.59 44.48L82.67 47.80L68.85 39.82Z"/></svg>

      <!-- Effort mode of the shown run (src/effort.js): Light / Deep / «Deep готовится…». -->
      <span id="effort-status" class="nobs-effort-status"></span>
      <p class="nobs-demo-banner" role="note" data-i18n="banner.ai">Разборы сделаны автоматически (AI) и могут содержать ошибки; проверяйте источники.</p>
    </header>
    <div class="nobs-layout">
    <!-- Library (src/library.js): every completed analysis; click to switch. -->
    <aside id="library" class="nobs-library" aria-label="Analyses" data-i18n-aria="plr.aria.library"></aside>
    <main>
      <div id="player-container">
        <div id="player"></div>

        <!-- Flag/chain icon overlay, driven by bootstrapPlayerPage (src/main.js) via
             overlay-container's data-mode/data-flag attributes and chain-icon's
             display style. Lives inside #player-container (the element put into
             fullscreen by the control bar) and is absolutely positioned within it
             in styles.css, so it sits over the video and stays visible and
             clickable in fullscreen too. -->
        <div id="overlay-container" class="nobs-overlay" data-mode="processing" data-flag="">
          <span id="processing-indicator" class="nobs-processing" data-i18n="plr.processing">Processing…</span>
          <span id="failed-indicator" class="nobs-failed" data-i18n="plr.failed">Analysis failed.</span>
          <button id="chain-icon" type="button" class="nobs-icon nobs-chain-icon" aria-label="Related claims" data-i18n-aria="plr.aria.relatedClaims" style="display: none;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></button>
          <button id="flag-icon" type="button" class="nobs-icon nobs-flag-icon" aria-label="Claim fact-check" data-i18n-aria="plr.aria.flag"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 3h2v18H6zm3 1h9l-2 4 2 4H9z"/></svg></button>
        </div>

        <div id="popup-container" class="nobs-popup-container"></div>
      </div>

      <!-- Processing log (src/processingLog.js): outside #player-container so
           it never depends on, or is replaced by, the YouTube player. -->
      <section id="processing-log" aria-label="Processing log" data-i18n-aria="plr.aria.log"></section>
    </main>
    <!-- Claim list (src/claimList.js) in a collapsible right-hand panel:
         outside #player-container, so it is hidden in fullscreen; click a row
         to jump there and play. A second tab, «Скупы» (src/scoopList.js),
         appears when the run has a scoop generation. -->
    <aside id="claims-panel" class="nobs-claims-panel" aria-label="Claims" data-i18n-aria="plr.aria.claims">
      <div class="nobs-claims-panel-bar">
        <div class="nobs-panel-tabs" role="tablist" hidden>
          <button type="button" class="nobs-panel-tab" role="tab" id="tab-claims" data-tab="claims" aria-controls="claim-list" aria-selected="true"></button>
          <button type="button" class="nobs-panel-tab" role="tab" id="tab-scoops" data-tab="scoops" aria-controls="scoop-list" aria-selected="false" tabindex="-1"></button>
        </div>
      </div>
      <div id="claims-panel-content">
        <div id="claim-list" role="tabpanel" aria-labelledby="tab-claims"></div>
        <div id="scoop-list" role="tabpanel" aria-labelledby="tab-scoops" hidden></div>
      </div>
    </aside>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
      import { initUiLang, translatePage } from "./src/uiLang.js?v=922fa24595";
      import "./src/stringsPlayer.js?v=922fa24595";
      import { buildControlBar, latestRunId, resolveVideoId, whenYouTubeApiReady } from "./src/controlBar.js?v=922fa24595";
      import { bootstrapPlayerPage } from "./src/main.js?v=922fa24595";
      import { startProcessingLog } from "./src/processingLog.js?v=922fa24595";
      import { mountNerdToggle } from "./src/nerdToggle.js?v=922fa24595";
      import { startLibrary } from "./src/library.js?v=922fa24595";
      import { buildShareControl, isSolo, watchShareUrl } from "./src/share.js?v=922fa24595";
      import { renderClaimList } from "./src/claimList.js?v=922fa24595";
      import { buildRailFilters } from "./src/railFilters.js?v=922fa24595";
      import { fetchUiConfig } from "./src/uiConfig.js?v=922fa24595";
      import { verdictKey } from "./src/popup.js?v=922fa24595";
      import { renderScoopList, seekToAnchor } from "./src/scoopList.js?v=922fa24595";
      import { filterTimelineItems, timelineItems } from "./src/tags.js?v=922fa24595";
      import { downloadIcon, listIcon, makePanelToggle, setCollapsed } from "./src/sidePanel.js?v=922fa24595";
      import { downloadMarkdown, downloadTranscript, printReport } from "./src/report.js?v=922fa24595";
      import { t } from "./src/i18n.js?v=922fa24595";
      import { showRunAction, withVisibleClaims } from "./src/progress.js?v=922fa24595";
      import { checkVoiceHealth, createNarrator, loadEnabled, normalizeLang, saveEnabled } from "./src/voice.js?v=922fa24595";
      import { createEngine, createSystemEngine, fetchVoiceEngines, findSystemVoice, isSystemVoiceId, piperSupported, resolveEngineId, systemSupported, systemVoiceIds, systemVoiceNames } from "./src/voiceEngines.js?v=922fa24595";
      import { countLines, effectivePersona, needsLines, unavailablePersonas, voiceStatusLines } from "./src/voiceStatus.js?v=922fa24595";
      import { createHoldIcon } from "./src/holdIcon.js?v=922fa24595";
      import { builtinProfiles, fetchCommentators, isParody, parodyCaption, parodyWord, personaLabel, resolvePersona } from "./src/commentators.js?v=922fa24595";
      import { createCommentatorMenu } from "./src/commentatorMenu.js?v=922fa24595";
      import { createPlaybackGate } from "./src/playbackGate.js?v=922fa24595";
      import { redirectTarget, runUrl, watchUpgrade } from "./src/effort.js?v=922fa24595";
      import { isMobileDevice, narratorLeadSec, personaVoiceAllowed, playerVars } from "./src/mobile.js?v=922fa24595";
      import { applyTheme, commentator, followPlayback, localVoiceIds, mountPanelSettings, onSettingsChange, seekTarget, setCommentators, setVoiceTester, setLocalVoices, setSetting, setSileroAvailable, showTagFilter, showTimelineFlags, voiceEngine, voiceRewindSec, voiceStyle, youtubeCaptions } from "./src/settings.js?v=922fa24595";
      // Interface language (RU / EN switch in the top bar): every label follows it;
      // claims and spoken lines stay in the video's language.
      const uiLang = initUiLang();
      document.title = t("plr.pageTitle", uiLang);
      translatePage(document, uiLang);
      for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria, uiLang));
      applyTheme(document);
      // A phone or tablet (src/mobile.js): the system voice by default, a
      // longer Piper lead, touch hints; CSS keys the layout on the screen size.
      const mobile = isMobileDevice(window);
      if (mobile) document.documentElement.dataset.mobile = "1";

      {
        const panel = document.getElementById("claims-panel");
        const toggle = makePanelToggle(panel, {
          contentId: "claims-panel-content",
          makeIcon: listIcon,
          showLabel: t("plr.showClaims", uiLang),
          hideLabel: t("plr.hideClaims", uiLang),
        });
        panel.querySelector(".nobs-claims-panel-bar").appendChild(toggle);
        setCollapsed(panel, true);
      }

      // Download the full write-up of the loaded run: PDF (print dialog,
      // "Save as PDF") or Markdown. Shown once the run is complete.
      let exportRun = null;
      function videoTitle() {
        try {
          return currentPlayer?.getVideoData?.().title ?? "";
        } catch {
          return "";
        }
      }
      function setupExport(run) {
        exportRun = run;
        const bar = document.querySelector(".nobs-claims-panel-bar");
        let wrap = bar.querySelector(".nobs-export");
        const lang = run.caption_language ?? "en";
        if (!wrap) {
          wrap = document.createElement("div");
          wrap.className = "nobs-export";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "nobs-side-toggle nobs-export-button";
          button.setAttribute("aria-haspopup", "menu");
          button.setAttribute("aria-expanded", "false");
          button.appendChild(downloadIcon(document));
          const menu = document.createElement("div");
          menu.className = "nobs-export-menu";
          menu.setAttribute("role", "menu");
          menu.hidden = true;
          const item = (kind, action) => {
            const entry = document.createElement("button");
            entry.type = "button";
            entry.setAttribute("role", "menuitem");
            entry.dataset.export = kind;
            entry.addEventListener("click", () => {
              closeMenu();
              // The scoops section of the write-up comes from the loaded tab.
              if (exportRun) action(scoopsResponse ? { ...exportRun, scoops: scoopsResponse } : exportRun, { title: videoTitle() });
            });
            return entry;
          };
          menu.append(
            item("pdf", printReport),
            item("md", downloadMarkdown),
            item("txt", (run, opts) => downloadTranscript(run, opts).catch((err) => console.error("transcript download failed", err)))
          );
          const closeMenu = () => {
            menu.hidden = true;
            button.setAttribute("aria-expanded", "false");
          };
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            menu.hidden = !menu.hidden;
            button.setAttribute("aria-expanded", String(!menu.hidden));
          });
          document.addEventListener("click", (event) => {
            if (!wrap.contains(event.target)) closeMenu();
          });
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeMenu();
          });
          wrap.append(button, menu);
          bar.insertBefore(wrap, bar.firstChild);
        }
        // Share: the public single-video link, next to download.
        bar.querySelector(".nobs-share")?.remove();
        wrap.after(
          buildShareControl(document, {
            getRunId: () => exportRun.run_id,
            lang,
            demo: document.documentElement.dataset.demo === "1",
            // watch mode (an Unlisted / Private analysis): the access-checked link, not the public one
            watchUrl: (() => {
              try {
                return watchShareUrl(window.location.search, window.sessionStorage, window.location.origin);
              } catch {
                return null;
              }
            })(),
          })
        );
        // Shared link: the settings gear stays next to share / download.
        if (isSolo(window.location.search)) mountPanelSettings(bar, document);
        const button = wrap.querySelector(".nobs-export-button");
        button.title = t("export.button", lang);
        button.setAttribute("aria-label", button.title);
        wrap.querySelector('[data-export="pdf"]').textContent = t("export.pdf", lang);
        wrap.querySelector('[data-export="md"]').textContent = t("export.md", lang);
        wrap.querySelector('[data-export="txt"]').textContent = t("export.txt", lang);
      }

      const params = new URLSearchParams(window.location.search);
      const runId = params.get("run_id");
      // Which finding filters the owner offers (admin «Фильтры находок»,
      // GET /ui-config); fetched alongside the rest, everything shown on failure.
      const uiConfigReady = fetchUiConfig();

      // No run and no video in the address: open the latest analysis.
      if (!runId && !params.get("video_id")) {
        const latest = await fetch("/runs").then((r) => (r.ok ? r.json() : null)).then(latestRunId).catch(() => null);
        if (latest != null) {
          params.set("run_id", String(latest));
          window.location.replace(`${window.location.pathname}?${params}${window.location.hash}`);
          await new Promise(() => {}); // the page is being replaced
        }
      }

      // Effort modes (src/effort.js): an old link to a light run that a deep
      // run has replaced opens the deep one -- on page load only, never under
      // a viewer (`&exact=1` keeps the old run). Then the Light/Deep badge;
      // while a deep pass runs it says so, and offers the deeper version
      // (a reload) once it is ready.
      // The «Доработать до Deep» button (local app) reports a new served
      // state: restart the badge watch with it («Deep готовится…», then the
      // «ready» notice). Nothing on screen is swapped.
      let upgradeWatch = null;
      document.addEventListener("nobs:served-changed", (event) => {
        if (!runId || !event.detail?.served) return;
        upgradeWatch?.stop();
        upgradeWatch = watchUpgrade({ root: document.getElementById("effort-status"), runId, info: event.detail, lang: "ru" });
      });
      if (runId) {
        const servedInfo = await Promise.race([
          fetch(`/runs/${encodeURIComponent(runId)}/served`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
          new Promise((done) => setTimeout(() => done(null), 1500)),
        ]);
        const servedTarget = redirectTarget(servedInfo, runId, window.location.search);
        if (servedTarget != null) {
          window.location.replace(runUrl(window.location.search, servedTarget));
          await new Promise(() => {}); // the page is being replaced
        }
        if (servedInfo?.served && !upgradeWatch) {
          upgradeWatch = watchUpgrade({ root: document.getElementById("effort-status"), runId, info: servedInfo, lang: "ru" });
        }
      }

      // Flag circles on the collapsed panel: shown as soon as the run's data
      // arrives, without waiting for the YouTube player. A choice made here
      // is picked up by the claim list when it renders (selectedFlags).
      const uiFilters = await uiConfigReady;
      function mountRail(run, onChange) {
        document.querySelector("#claims-panel .nobs-rail-filters")?.remove();
        const counts = {};
        for (const claim of run.claims ?? []) {
          const key = verdictKey(claim);
          counts[key] = (counts[key] ?? 0) + 1;
        }
        const built = buildRailFilters(document, {
          counts,
          selected: selectedFlags,
          lang: run.caption_language ?? "en",
          filters: uiFilters,
          onChange,
        });
        document.querySelector("#claims-panel .nobs-claims-panel-bar").after(built.root);
        return built;
      }
      if (runId) {
        fetch(`/runs/${runId}`)
          .then((response) => (response.ok ? response.json() : null))
          .then((run) => {
            if (!run || rail || !Array.isArray(run.claims) || !run.claims.length) return;
            rail = mountRail(withVisibleClaims(run), (flags) => {
              selectedFlags = flags;
              if (list) list.setFlags(flags);
            });
          })
          .catch(() => {});
      }

      // `?solo=1` (a shared link): only this video, no library of others.
      if (isSolo(window.location.search)) {
        document.documentElement.dataset.solo = "1";
        document.getElementById("library").hidden = true;
        // The gear lives in the hidden analyses panel: put one into the right
        // panel's bar, so a viewer of a shared link can change the voice too.
        mountPanelSettings(document.querySelector(".nobs-claims-panel-bar"), document);
      } else {
        startLibrary({ root: document.getElementById("library"), fetchImpl: fetch, currentRunId: runId });
      }

      // Started at once, independently of the YouTube player: the log and
      // status show even while the video loads (or if it fails to).
      if (runId) {
        startProcessingLog({
          runId,
          fetchImpl: fetch,
          pollIntervalMs: 1500,
          root: document.getElementById("processing-log"),
          // «Проанализировано 7:40 / 41:20 · …» in the run's language.
          lang: () => document.body.dataset.lang || "en",
        });
        // A finished run's log hides behind «For nerds» (src/nerdToggle.js).
        mountNerdToggle(document.getElementById("processing-log"));
      }

      // ---- Right panel tabs: claims / scoops ----
      const TAB_KEY = "nobs.panelTab";
      const tabs = document.querySelector(".nobs-panel-tabs");
      const panes = { claims: document.getElementById("claim-list"), scoops: document.getElementById("scoop-list") };
      let scoopsResponse = null;
      let scoopsKey = null;
      let scoopView = null;
      let scoopPoll = null;
      function savedTab() {
        try {
          return localStorage.getItem(TAB_KEY) === "scoops" ? "scoops" : "claims";
        } catch {
          return "claims";
        }
      }
      function selectTab(name) {
        if (tabs.hidden) name = "claims";
        for (const button of tabs.querySelectorAll("[role=tab]")) {
          const on = button.dataset.tab === name;
          button.setAttribute("aria-selected", String(on));
          button.tabIndex = on ? 0 : -1;
        }
        for (const [key, pane] of Object.entries(panes)) pane.hidden = key !== name;
      }
      for (const button of tabs.querySelectorAll("[role=tab]")) {
        button.addEventListener("click", () => {
          selectTab(button.dataset.tab);
          try {
            localStorage.setItem(TAB_KEY, button.dataset.tab);
          } catch {
            // Storage blocked: the choice lasts for this page only.
          }
        });
        button.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          const other = tabs.querySelector(`[role=tab]:not([data-tab="${button.dataset.tab}"])`);
          other.click();
          other.focus();
        });
      }
      function labelTabs(lang, count) {
        tabs.querySelector('[data-tab="claims"]').textContent = t("scoop.tabClaims", lang);
        const scoopTab = tabs.querySelector('[data-tab="scoops"]');
        scoopTab.textContent = t("scoop.tab", lang);
        if (count) {
          const badge = document.createElement("span");
          badge.className = "nobs-panel-tab-count";
          badge.textContent = String(count);
          scoopTab.appendChild(badge);
        }
      }
      function seekTo(sec) {
        seekToAnchor(currentPlayer, sec);
        gate?.seeked(Number(sec) || 0);
      }
      function drawScoops(run, status) {
        const lang = run.caption_language ?? "en";
        const demo = document.documentElement.dataset.demo === "1";
        scoopView = renderScoopList(panes.scoops, run, scoopsResponse, {
          lang,
          status,
          onSeek: seekTo,
          onSelectClaim: (claim) => seekTo(claim.start_sec),
          onRegenerate: demo ? undefined : () => regenerateScoops(run),
        });
        labelTabs(lang, scoopsResponse?.scoop_run?.status === "complete" ? (scoopsResponse.scoops ?? []).length : 0);
      }
      async function loadScoops(run) {
        const response = await fetch(`/runs/${run.run_id}/scoops`);
        if (!response.ok) throw new Error(`scoops: HTTP ${response.status}`);
        const before = scoopsResponse?.scoop_run?.id ?? null;
        scoopsResponse = await response.json();
        drawScoops(run);
        // A new finished scoop generation: the commentator's scoop lines are
        // stale now (voice-texts answers "stale" and is regenerated once).
        const after = scoopsResponse?.scoop_run?.status === "complete" ? (scoopsResponse.scoop_run.id ?? null) : null;
        if (before !== null && after !== null && before !== after) narrator?.reloadTexts();
        if (scoopsResponse.active) pollScoops(run, scoopsResponse.active.id);
      }
      function pollScoops(run, scoopRunId) {
        clearTimeout(scoopPoll);
        scoopPoll = setTimeout(async () => {
          try {
            const status = await (await fetch(`/scoop-runs/${scoopRunId}/status`)).json();
            if (status.status === "pending" || status.status === "running") {
              drawScoops(run, status);
              pollScoops(run, scoopRunId);
            } else {
              await loadScoops(run);
            }
          } catch (err) {
            console.error("scoop status failed", err);
            pollScoops(run, scoopRunId);
          }
        }, 3000);
      }
      async function regenerateScoops(run) {
        try {
          const response = await fetch(`/runs/${run.run_id}/scoops`, { method: "POST" });
          if (!response.ok && response.status !== 409) throw new Error(`scoops: HTTP ${response.status}`);
          await loadScoops(run);
        } catch (err) {
          console.error("scoop generation failed to start", err);
        }
      }
      // The tab exists only when the run has a scoop generation (finished,
      // running or failed); otherwise the panel shows the claims alone.
      function setupScoops(run) {
        const summary = run.scoops ?? null;
        tabs.hidden = !summary;
        if (!summary) {
          scoopsResponse = null;
          scoopView = null;
          selectTab("claims");
          return;
        }
        labelTabs(run.caption_language ?? "en", summary.shown ?? 0);
        selectTab(savedTab());
        const key = `${run.run_id}:${summary.scoop_run_id}:${summary.active_id}`;
        if (key === scoopsKey) {
          if (scoopsResponse) drawScoops(run);
          return;
        }
        scoopsKey = key;
        loadScoops(run).catch((err) => console.error("scoops failed to load", err));
      }

      // ---- Flag narrator (src/voice.js): reads each shown flag aloud ----
      // Its button (next to the volume control) shows for a run in a language

                    flagIcon: document.getElementById("flag-icon"),
                    chainIcon: document.getElementById("chain-icon"),
                    popupContainer: document.getElementById("popup-container"),
                    overlayContainer: document.getElementById("overlay-container"),
                    failedIndicator: document.getElementById("failed-indicator"),
                  },
                  onRunLoaded: (run) => showRun(run),
                  // A streaming run in progress: claims as they are found
                  // and checked, and the analysis frontier on the timeline.
                  onRunProgress: (run) => showLiveRun(run),
                  // Every status: the gate shows, waits, pauses at the
                  // frontier; at the end it goes (a held video plays on).
                  onStatus: (status) => {
                    if (status?.caption_language) gateLang = status.caption_language;
                    gate?.update(status);
                    if (status?.status === "complete" || status?.status === "failed") gate?.finish();
                  },
                  onProgress: (status) =>
                    controls?.setFrontier({
                      processedUntil: status.processed_until_sec ?? 0,
                      readyRanges: status.ready_ranges ?? [],
                      durationSec: status.duration_sec,
                    }),
                  // The presentation tags finished after the run was shown.
                  onRunUpdated: (run) => showRun(run),
                });
              }
            },
          },
        });
      }

      // Also covers the API having loaded before this deferred module ran.
      whenYouTubeApiReady(window, () => {
        apiReady = true;
        initPlayerIfReady();
      });

      resolveVideoId(params, fetch)
        .then((resolved) => {
          videoId = resolved;
          initPlayerIfReady();
        })
        .catch((err) => {
          console.error(err);
          const container = document.getElementById("player-container");
          container.textContent = t("plr.loadFailed", uiLang).replace("{error}", err.message);
        });
    </script>
  <script type="module" src="src/accountMenuBoot.js"></script>
  </body>
</html>
